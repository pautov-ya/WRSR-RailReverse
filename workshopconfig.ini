$ITEM_DESC "[h1]Rail Operations[/h1]
A plugin that makes trains work more like a real railway.

[h2]Reversing[/h2]
When a train reverses, its locomotive stays put and [b]pushes the wagons back[/b], as in real shunting:
[list]
[*] pushing speed is capped at 25 km/h (the Soviet shunting limit);
[*] reversing is switched on per train, for all freight trains, or for all passenger trains;
[*] trains with a locomotive at each end reverse as in the base game.
[/list]

[h2]Supply base wagon limit[/h2]
Each locomotive can be given how many wagons it takes from a rail supply base: 1 to 20 (the maximum is [b]hub_limit_max[/b] in railreverse.ini).

[h2]Controls[/h2]
The mod adds buttons to the locomotive window and to the route window.

[h3]Locomotive window[/h3]
Two buttons to the right of the signal button:
[list]
[*] [b]Reversing[/b] switches reversing on and off for the selected train. It is green while the train reverses: switched on for the train or for all trains of its kind.
[*] [b]Wagons from a supply base[/b] sets how many wagons the locomotive takes from a supply base: left click +1, right click -1.
[/list]

[h3]Route window[/h3]
Two buttons in the top row, for the waypoint or signal stop selected in the list:
[list]
[*] [b]Uncouple[/b]: the train leaves its wagons at this stop.
[*] [b]Stop and turn round[/b]: the train stops at this stop and turns round. With reversing on, the locomotive pushes the wagons back; with reversing off, the train turns round as in the base game.
[/list]
With Uncouple you can build a route on which the locomotive runs round its train, as at a real station. After the uncouple stop, add route stops that lead the locomotive by a neighbouring track to the other end of the wagons: there it couples.

Marked stops are shown with icons in the route's list. A mark is for this route only. [b]shunting = 0[/b] in railreverse.ini turns these buttons off.

[h3]Options → Scripts[/h3]
Reversing is switched on and off for all freight or all passenger trains. The state is kept in each save.

[h3]Hotkeys[/h3]
With a train window open:
[list]
[*] [b]Ctrl+F9[/b]: reverse for the selected train
[*] [b]Ctrl -[/b] / [b]Ctrl +[/b]: wagon limit -1 / +1
[*] [b]Ctrl Shift -[/b]: no wagon limit
[/list]
Keys, speeds and the place of the buttons are set in [b]railreverse.ini[/b]. Settings are kept in the save and in a file next to it; the save itself is not changed.

[h2]Installation[/h2]
[list]
[*] Game version [b]1.1.1.9[/b], 64-bit.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: start the game from it, with [b]railreverse[/b] enabled under Plugins.
[*] Compatible with [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3776784867]RailPhysics[/url].
[/list]

[h2]Installation with TesmioLoader[/h2]
The mod also works with [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3773169177]TesmioLoader[/url] instead of RML, but it has not been fully tested with it.
[olist]
[*] Copy the [b]tesmioloader[/b] folder from the TesmioLoader Workshop folder (784150\3773169177) into the game folder, next to media_soviet.
[*] Copy all files from this mod's plugins folder (784150\3823129138\plugins) into tesmioloader\build\plugins.
[*] Start Steam, then tesmioloader\build\tesmiolauncher.exe.
[/olist]
After an update of the mod, copy the files from plugins again.

[h2]Known limitations[/h2]
[list]
[*] When a supply base takes [b]all[/b] the wagons of a pushing train, the locomotive jumps to where the first wagon was.
[*] Wagons left at an uncouple stop stand as a train without a locomotive. Saved like that and loaded with a mod version before 0.6.0, they can slow the game down until it removes them: let the locomotives couple back before going back to an older version.
[*] Running round, the train window buttons and the Scripts menu switches work with game version 1.1.1.9 only.
[/list]

Source code, bug reports: [url=https://github.com/pautov-ya/WRSR-RailReverse]GitHub[/url]. License: GPL v3.

[h1]Железнодорожное движение[/h1]
Плагин, который делает работу поездов ближе к настоящей железной дороге.

[h2]Реверс[/h2]
При развороте локомотив остается на месте и [b]толкает вагоны назад[/b], как при маневрах:
[list]
[*] скорость при толкании не выше 25 км/ч (советская норма для маневров);
[*] реверс включается для отдельного поезда, для всех грузовых или для всех пассажирских;
[*] поезда с локомотивами с обеих сторон разворачиваются как в обычной игре.
[/list]

[h2]Лимит вагонов с базы снабжения[/h2]
Каждому локомотиву можно задать, сколько вагонов он берет с железнодорожной базы снабжения: от 1 до 20 (максимум задается [b]hub_limit_max[/b] в railreverse.ini).

[h2]Управление[/h2]
Мод добавляет кнопки в окно локомотива и в окно маршрута.

[h3]Окно локомотива[/h3]
Две кнопки справа от кнопки светофора:
[list]
[*] [b]Реверс[/b] включает и выключает реверс у выбранного поезда. Кнопка зеленая, когда реверс работает: включен у поезда или у всех поездов его типа.
[*] [b]Вагоны с базы снабжения[/b] задает, сколько вагонов локомотив берет с базы снабжения: левый клик +1, правый -1.
[/list]

[h3]Окно маршрута[/h3]
Две кнопки в верхнем ряду, для пункта маршрута или светофора, выбранного в списке:
[list]
[*] [b]Расцепка[/b] – в этой остановке поезд оставляет вагоны.
[*] [b]Стоп и разворот[/b] – в этой остановке поезд останавливается и разворачивается. Если у поезда включен реверс, локомотив толкает вагоны назад. Если выключен, поезд разворачивается как в обычной игре.
[/list]
С расцепкой можно построить маршрут, по которому локомотив обгоняет свой состав, как на настоящей станции. После пункта с расцепкой добавьте пункты маршрута, которые ведут локомотив по соседнему пути на другой конец вагонов: там он прицепится.

Отмеченные пункты показаны значками в списке маршрута. Отметка действует только для этого маршрута. [b]shunting = 0[/b] в railreverse.ini выключает эти кнопки.

[h3]Меню Параметры → Скрипты[/h3]
Здесь реверс включается и выключается у всех грузовых или у всех пассажирских поездов. Состояние сохраняется в каждом сейве.

[h3]Горячие клавиши[/h3]
Работают при открытом окне поезда:
[list]
[*] [b]Ctrl+F9[/b]: реверс у выбранного поезда
[*] [b]Ctrl -[/b] / [b]Ctrl +[/b]: лимит вагонов -1 / +1
[*] [b]Ctrl Shift -[/b]: без лимита вагонов
[/list]
Клавиши, скорости и место кнопок настраиваются в [b]railreverse.ini[/b]. Настройки хранятся в сохранении и в файле рядом с ним, сам сейв не меняется.

[h2]Установка[/h2]
[list]
[*] Игра версии [b]1.1.1.9[/b], 64-бит.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: запускайте игру через него, с включенным [b]railreverse[/b] на вкладке Plugins.
[*] Совместим с [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3776784867]RailPhysics[/url].
[/list]

[h2]Установка через TesmioLoader[/h2]
Мод работает и с [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3773169177]TesmioLoader[/url] вместо RML, но под ним полностью не тестировался.
[olist]
[*] Скопируйте папку [b]tesmioloader[/b] из папки TesmioLoader в Workshop (784150\3773169177) в папку игры, рядом с media_soviet.
[*] Скопируйте все файлы из папки plugins этого мода (784150\3823129138\plugins) в tesmioloader\build\plugins.
[*] Запустите Steam, затем tesmioloader\build\tesmiolauncher.exe.
[/olist]
После обновления мода скопируйте файлы из plugins заново.

[h2]Известные ограничения[/h2]
[list]
[*] Когда база снабжения забирает [b]все[/b] вагоны толкающего поезда, локомотив перескакивает на место первого вагона.
[*] Вагоны, оставленные при расцепке, стоят составом без локомотива. Если сохраниться так и загрузить сейв с версией мода до 0.6.0, игра может тормозить, пока не удалит такие составы: перед откатом мода дайте локомотивам прицепиться обратно.
[*] Обгон, кнопки окна поезда и меню «Скрипты» работают только в игре версии 1.1.1.9.
[/list]

Исходный код и сообщения об ошибках: [url=https://github.com/pautov-ya/WRSR-RailReverse]GitHub[/url]. Лицензия: GPL v3."

