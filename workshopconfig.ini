$ITEM_DESC "[h1]Rail Reverse[/h1]

A plugin that makes trains work more like a real railway.

[h2]Reversing[/h2]
In the base game, a reversing train's locomotive instantly jumps to the other end. With Rail Reverse it stays put and [b]pushes the wagons back[/b], as in real shunting:
[list]
[*] pushing speed is capped at 25 km/h (the Soviet shunting limit);
[*] a locomotive without wagons runs backwards instead of turning round;
[*] reversing is switched on per train, for all freight trains, or for all passenger trains;
[*] trains with a locomotive at each end work as in the base game.
[/list]

[h2]Hub wagon limit[/h2]
In the base game, a distribution office (hub) fills a train with wagons up to the length of its track. Rail Reverse lets you give each locomotive its own limit: 1 to 10 wagons.

[h2]Controls[/h2]
With a train window open:
[list]
[*] [b]Ctrl+F9[/b] — reverse for this train
[*] [b]Ctrl+Shift+F9[/b] — reverse for all freight trains
[*] [b]Ctrl+Alt+F9[/b] — reverse for all passenger trains
[*] [b]Ctrl -[/b] / [b]Ctrl +[/b] — hub wagon limit -1 / +1
[*] [b]Ctrl Shift -[/b] — no hub wagon limit
[/list]
Keys and speeds are set in [b]railreverse.ini[/b]. Settings are kept in a file next to the save; the save itself is not changed.

[h2]Requirements[/h2]
[list]
[*] Game version [b]1.1.1.9[/b], 64-bit.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: start the game from it, with [b]railreverse[/b] enabled under Plugins.
[*] Compatible with [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3776784867]RailPhysics[/url].
[/list]

[h2]Known limitations[/h2]
When a hub takes [b]all[/b] the wagons of a pushing train, the locomotive jumps to where the first wagon was.

Source code, bug reports: [url=https://github.com/pautov-ya/WRSR-RailReverse]GitHub[/url]. License: GPL v3.

[h1]Rail Reverse (RU)[/h1]

Плагин, который делает работу поездов ближе к настоящей железной дороге.

[h2]Реверс[/h2]
В обычной игре при развороте локомотив мгновенно перескакивает на другой конец состава. С Rail Reverse он остаётся на месте и [b]толкает вагоны назад[/b], как при маневрах:
[list]
[*] скорость при толкании не выше 25 км/ч (советская норма для маневров);
[*] локомотив без вагонов едет задним ходом, а не разворачивается;
[*] реверс включается для отдельного поезда, для всех грузовых или для всех пассажирских;
[*] поезда с локомотивами с обеих сторон работают как в обычной игре.
[/list]

[h2]Лимит вагонов из хаба[/h2]
В обычной игре распределительный центр (хаб) заполняет поезд вагонами на всю длину своего пути. Rail Reverse позволяет задать каждому локомотиву свой лимит: от 1 до 10 вагонов.

[h2]Управление[/h2]
При открытом окне поезда:
[list]
[*] [b]Ctrl+F9[/b] — реверс у этого поезда
[*] [b]Ctrl+Shift+F9[/b] — реверс у всех грузовых
[*] [b]Ctrl+Alt+F9[/b] — реверс у всех пассажирских
[*] [b]Ctrl -[/b] / [b]Ctrl +[/b] — лимит вагонов из хаба -1 / +1
[*] [b]Ctrl Shift -[/b] — без лимита вагонов из хаба
[/list]
Клавиши и скорости настраиваются в [b]railreverse.ini[/b]. Настройки хранятся в файле рядом с сохранением, сам сейв не меняется.

[h2]Что нужно[/h2]
[list]
[*] Игра версии [b]1.1.1.9[/b], 64-бит.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: запускайте игру через него, с включённым [b]railreverse[/b] на вкладке Plugins.
[*] Совместим с [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3776784867]RailPhysics[/url].
[/list]

[h2]Известные ограничения[/h2]
Когда хаб забирает [b]все[/b] вагоны толкающего поезда, локомотив перескакивает на место первого вагона.

Исходный код и сообщения об ошибках: [url=https://github.com/pautov-ya/WRSR-RailReverse]GitHub[/url]. Лицензия: GPL v3."

