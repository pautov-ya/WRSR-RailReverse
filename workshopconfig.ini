$ITEM_DESC "[h1]Rail Reverse[/h1]

A plugin that makes trains work more like a real railway.

[h2]Reversing[/h2]
In the base game, a reversing train's locomotive instantly jumps to the other end. With Rail Reverse it stays put and [b]pushes the wagons back[/b], as in real shunting:
[list]
[*] pushing speed is capped at 25 km/h (the Soviet shunting limit);
[*] a locomotive without wagons runs backwards instead of turning round;
[*] reversing is switched on per train, for all freight trains, or for all passenger trains;
[*] trains with a locomotive at each end work as in the base game.
[/list]

[h2]Supply base wagon limit[/h2]
In the base game, a rail supply base fills a train with wagons up to the length of its track. Rail Reverse lets you give each locomotive its own limit: 1 to 20 wagons (the maximum is [b]hub_limit_max[/b] in railreverse.ini).

[h2]Controls[/h2]
The train window has two new buttons next to its signal button:
[list]
[*] [b]reversing for the selected train[/b]: green while the train pushes its wagons;
[*] [b]wagons from a supply base[/b]: left click +1, right click -1. Past 20 and below 1 it is "no limit" again.
[/list]
Reversing for all freight or all passenger trains is switched in [b]Options → Scripts[/b]: all freight on/off and all passenger on/off. Their state is kept in each save.

The hotkeys work with a train window open:
[list]
[*] [b]Ctrl+F9[/b]: reverse for the selected train
[*] [b]Ctrl -[/b] / [b]Ctrl +[/b]: wagon limit -1 / +1
[*] [b]Ctrl Shift -[/b]: no wagon limit
[/list]
Keys, speeds and the place of the buttons are set in [b]railreverse.ini[/b]. Settings are kept in the save and in a file next to it; the save itself is not changed.

[h2]Requirements[/h2]
[list]
[*] Game version [b]1.1.1.9[/b], 64-bit.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: start the game from it, with [b]railreverse[/b] enabled under Plugins.
[*] Compatible with [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3776784867]RailPhysics[/url].
[/list]

[h2]Known limitations[/h2]
When a supply base takes [b]all[/b] the wagons of a pushing train, the locomotive jumps to where the first wagon was.

Source code, bug reports: [url=https://github.com/pautov-ya/WRSR-RailReverse]GitHub[/url]. License: GPL v3.

[h1]Rail Reverse (RU)[/h1]

Плагин, который делает работу поездов ближе к настоящей железной дороге.

[h2]Реверс[/h2]
В обычной игре при развороте локомотив мгновенно перескакивает на другой конец состава. С Rail Reverse он остается на месте и [b]толкает вагоны назад[/b], как при маневрах:
[list]
[*] скорость при толкании не выше 25 км/ч (советская норма для маневров);
[*] локомотив без вагонов едет задним ходом, а не разворачивается;
[*] реверс включается для отдельного поезда, для всех грузовых или для всех пассажирских;
[*] поезда с локомотивами с обеих сторон работают как в обычной игре.
[/list]

[h2]Лимит вагонов с базы снабжения[/h2]
В обычной игре железнодорожная база снабжения заполняет поезд вагонами на всю длину своего пути. Rail Reverse позволяет задать каждому локомотиву свой лимит: от 1 до 20 вагонов (максимум задается [b]hub_limit_max[/b] в railreverse.ini).

[h2]Управление[/h2]
В окне поезда возле кнопки светофора две новых кнопки:
[list]
[*] [b]реверс выбранного поезда[/b]: зеленая, если поезд толкает вагоны;
[*] [b]вагоны с базы снабжения[/b]: левый клик +1, правый -1. После 20 и перед 1 снова «без ограничения».
[/list]
Реверс у всех грузовых или у всех пассажирских включается в меню [b]Параметры → Скрипты[/b]: все грузовые вкл/выкл и все пассажирские вкл/выкл. Состояние сохраняется в каждом сейве.

Горячие клавиши работают при открытом окне поезда:
[list]
[*] [b]Ctrl+F9[/b]: реверс у выбранного поезда
[*] [b]Ctrl -[/b] / [b]Ctrl +[/b]: лимит вагонов -1 / +1
[*] [b]Ctrl Shift -[/b]: без лимита вагонов
[/list]
Клавиши, скорости и место кнопок настраиваются в [b]railreverse.ini[/b]. Настройки хранятся в сохранении и в файле рядом с ним, сам сейв не меняется.

[h2]Что нужно[/h2]
[list]
[*] Игра версии [b]1.1.1.9[/b], 64-бит.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: запускайте игру через него, с включенным [b]railreverse[/b] на вкладке Plugins.
[*] Совместим с [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3776784867]RailPhysics[/url].
[/list]

[h2]Известные ограничения[/h2]
Когда база снабжения забирает [b]все[/b] вагоны толкающего поезда, локомотив перескакивает на место первого вагона.

Исходный код и сообщения об ошибках: [url=https://github.com/pautov-ya/WRSR-RailReverse]GitHub[/url]. Лицензия: GPL v3."

