; railreverse - locomotive pushes the train back instead of jumping to the other end.
; UTF-8 without BOM. Restart the game after a change.

[railreverse]

; 0 = the plugin loads, does nothing and unloads.
enabled = 1

; A train pushes after a reversal if reversing was turned on in its window,
; or if every train of its class is switched on. A passenger train is one with
; at least one passenger car. These two are the starting values for a save
; without railreverse.txt; in game they are switched with the keys below and
; then remembered per save.
all_freight = 0
all_passenger = 0

; Keys, active while a train window is open (any car of the train).
key_train = CTRL+F9
key_all_freight = CTRL+SHIFT+F9
key_all_passenger = CTRL+ALT+F9

; Speed limit while the locomotive is pushing, km/h. 0 = no limit.
; 25 km/h is the Soviet/Russian shunting limit for moving wagons first.
push_speed_kmh = 25

; Speed limit for a locomotive running backwards on its own (no wagons), km/h.
; 0 = no limit (Soviet/Russian rules allow a light engine 60 km/h either way).
light_engine_speed_kmh = 0

; 1 = trains with a locomotive at both ends are left as in the vanilla game.
skip_loco_both_ends = 1

; State lines, shown while a train window is open: 1 = on.
indicator = 1
; The values below are re-read every 2 seconds: edit, save, look.
; Screen corner the three lines are placed by:
;   top_left, bottom_left, top_right, bottom_right
indicator_anchor = bottom_left
; Distance from that corner, in % of the screen width (x) and height (y),
; so it lands in the same place at any resolution. Decimals allowed (0.6).
; For a bottom corner y is measured to the bottom of the block.
indicator_x = 0.6
indicator_y = 0
; Font size, % of the game's usual UI font (the nearest font the game has is used).
indicator_font_scale = 140
; Dark outline around the letters, px. 0 = none.
indicator_outline = 1

; 1 = one line per reversal in the RML log.
log_flips = 1
