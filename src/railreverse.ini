; Rail Operations (railreverse) - trains work more like a real railway: reversing, supply base wagon limit, running round.
; UTF-8 without BOM. Restart the game after a change.

[railreverse]

; 0 = the plugin loads, does nothing and unloads.
enabled = 1

; A train pushes after a reversal if reversing was turned on in its window,
; or if all trains of its class are switched on in the Scripts menu
; (Options -> Scripts; kept in each save). A passenger train is one with at
; least one passenger car.

; Keys, active while a train window is open (any car of the train).
key_train = CTRL+F9

; In the train window: most wagons a supply base (rail distribution office)
; hands this locomotive, 1 ... hub_limit_max or no limit. The button under the
; signal button sets it too: left click +1, right click -1. Both go round:
; past hub_limit_max and below 1 it is no limit again, as with the keys.
; Offices hand wagons in groups as they keep them, so a group may take a
; train one or two over the limit.
; MINUS is the -_ key, PLUS the =+ key (pressed without Shift); NUMPADMINUS
; and NUMPADPLUS are the keypad ones. F1-F12, letters and digits work too.
key_hub_limit_up = CTRL+PLUS
key_hub_limit_down = CTRL+MINUS
key_hub_limit_reset = CTRL+SHIFT+MINUS
; The highest limit, 1 ... 255; one more step is no limit again.
hub_limit_max = 20

; Speed limit while the locomotive is pushing, km/h. 0 = no limit.
; 25 km/h is the Soviet/Russian shunting limit for moving wagons first.
push_speed_kmh = 25

; Speed limit for a locomotive running backwards on its own (no wagons), km/h.
; 0 = no limit (Soviet/Russian rules allow a light engine 60 km/h either way).
light_engine_speed_kmh = 0

; 1 = trains with a locomotive at both ends are left as in the vanilla game.
skip_loco_both_ends = 1

; Two buttons in the train window, under the game's signal button: reversing
; for this train and the wagon limit. 1 = on.
window_buttons = 1
; Their place (centre of the upper one) from the window's corner, in game
; units at 100 % UI scale. Re-read every 2 seconds.
window_button_x = 570
window_button_y = 24

; State lines in a corner of the screen while a train window is open (as in
; 0.4), for testing: 1 = on.
indicator = 0
; Their language: auto (Russian when the game is in Russian, English otherwise),
; ru or en.
language = auto
; The values below are re-read every 2 seconds: edit, save, look.
; Screen corner the four lines are placed by:
;   top_left, bottom_left, top_right, bottom_right
indicator_anchor = bottom_left
; Distance from that corner, in % of the screen width (x) and height (y),
; so it lands in the same place at any resolution. Decimals allowed (0.6).
; For a bottom corner y is measured to the bottom of the block.
indicator_x = 0.6
indicator_y = 0
; Font size, % of the game's usual UI font (the nearest font the game has is used).
indicator_font_scale = 140
; Dark outline around the letters, px. 0 = none.
indicator_outline = 1

; 1 = on a crash, write to the RML log which module and offset it happened at
; (diagnostic only, changes nothing).
crash_log = 1

; 1 = one line per reversal in the RML log.
log_flips = 1

; Shunting: the route window gets two buttons for a waypoint or signal stop,
; "uncouple" (the locomotive leaves its wagons there, runs round them by the
; route's next stops and couples at the other end) and "stop and turn round"
; (the train stops there and sets off the other way). 0 = off.
shunting = 1

; Research only: 1 = lines about shunting trains in the RML log, every second
; per train (their way, speed, signals). Makes the log big.
research_log = 0
